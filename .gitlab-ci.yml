# Build the Astro Starlight site and publish it to GitLab Pages.
#
# This project uses a GitLab Pages "unique domain" and is served from the root
# (https://qti3-doc-ac52af.pages.bks.kennisnet.nl/), so astro.config.mjs uses no
# base path. Pagefind search and all assets/links resolve from the root.
#
# If it is ever served under a subpath instead, set `BASE` in astro.config.mjs
# (e.g. '/qti3-doc') and prefix the hero links in src/content/docs/index.mdx.

image: node:22

# Reuse installed dependencies and Astro's cache between runs.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .astro/

pages:
  stage: deploy
  script:
    # `npm install` (not the stricter `npm ci`) reconciles cross-platform
    # optional-dependency drift in the lock file between the authoring machine
    # and the linux CI runner.
    - npm install --no-audit --no-fund
    - npm run build
    # GitLab Pages publishes the `public/` directory. Astro builds into `dist/`;
    # the source `public/` assets are already copied into `dist/` by the build,
    # so we can replace it with the built output.
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    # Deploy only from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
